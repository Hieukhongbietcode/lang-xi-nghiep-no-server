<style>
    :root { --bg:#0b1120; --card:#131c31; --line:#26324a; --txt:#e2e8f0; --mute:#8a96b0; --iris:#7E63F2; --iris2:#a5b4fc; --ok:#22c55e; --bad:#ef4444; --warn:#eab308; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0); display:flex; flex-direction:column; align-items:center;
        background: radial-gradient(120% 60% at 50% 0%, #1b2547 0%, var(--bg) 60%); }
    .wrap { width:100%; max-width:440px; flex:1; display:flex; flex-direction:column; padding:28px 0 24px; }
    .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:22px; }
    .brand img { width:64px; height:64px; filter: drop-shadow(0 6px 18px rgba(249,115,22,.35)); }
    .brand h1 { margin:0; font-size:22px; font-weight:900; letter-spacing:-.01em; }
    .brand p { margin:0; color:var(--mute); font-size:13px; font-weight:600; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; animation: pop .28s cubic-bezier(.2,.8,.2,1.1) both; }
    @keyframes pop { from { opacity:0; transform: translateY(8px) scale(.98) } to { opacity:1; transform:none } }
    label { display:block; font-size:12px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
    input { width:100%; font:inherit; font-size:17px; font-weight:700; color:var(--txt); background:#0b1222; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; transition: border-color .2s; }
    input:focus { border-color: var(--iris); }
    #in-code { text-transform:uppercase; letter-spacing:.35em; text-align:center; font-size:22px; font-weight:900; }
    .field { margin-bottom:16px; }
    .btn { width:100%; font:inherit; font-size:16px; font-weight:800; border:none; border-radius:14px; padding:15px; cursor:pointer; transition: transform .1s, opacity .2s, background-color .2s; }
    .btn:active { transform: scale(.97); }
    .btn-main { background: var(--iris); color:#fff; box-shadow: 0 8px 24px rgba(126,99,242,.35); }
    .btn-main:disabled { opacity:.5; cursor:default; box-shadow:none; }
    .btn-ghost { background:transparent; color:var(--mute); border:1px solid var(--line); margin-top:12px; }
    .err { min-height:20px; margin:10px 0 0; color:#f87171; font-size:14px; font-weight:700; text-align:center; }
    .err.big { font-size:17px; }
    .room-head { text-align:center; margin-bottom:14px; }
    .room-head .lbl { color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .room-head .code { font-size:38px; font-weight:900; letter-spacing:.25em; margin-top:2px; }
    .me { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--iris2); font-weight:800; margin-bottom:14px; }
    .status { text-align:center; padding:12px; border-radius:14px; background:#0f1730; color:var(--iris2); font-weight:700; font-size:14px; margin-bottom:14px; }
    .status.locked { color:#fde68a; background:#2a2410; }
    .status .dots::after { content:''; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0% { content:'' } 25% { content:'.' } 50% { content:'..' } 75% { content:'...' } }
    .list-head { display:flex; justify-content:space-between; color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 8px; }
    .plist { display:flex; flex-direction:column; gap:6px; }
    .pl { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:#0f1626; animation: pop .25s ease both; }
    .pl.mine { box-shadow: inset 3px 0 0 var(--iris); background:#151d36; }
    .av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; flex-shrink:0; }
    .pl .nm { flex:1; font-weight:700; }
    .dot { width:9px; height:9px; border-radius:50%; background:#475569; transition: background-color .3s; }
    .dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(34,197,94,.18); }
    .gm-line { display:flex; align-items:center; gap:8px; justify-content:center; color:var(--mute); font-size:13px; font-weight:700; margin-top:14px; }
    #net { position:fixed; left:50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%) translateY(-140%); z-index:50;
        background:#1e293b; border:1px solid var(--line); color:var(--txt); font-size:13px; font-weight:700; padding:9px 14px; border-radius:999px;
        box-shadow:0 8px 24px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.2,.8,.2,1); white-space:nowrap; }
    #net.show { transform: translateX(-50%) translateY(0); }
    .end { text-align:center; padding:28px 20px; }
    .end .ic { font-size:44px; margin-bottom:8px; }
    .end h2 { margin:0 0 6px; font-size:20px; }
    .end p { margin:0 0 18px; color:var(--mute); font-weight:600; }
    .hidden { display:none !important; }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>

        <h1>Làng Xí Nghiệp Nợ</h1>
        <p>Ma Sói online</p>
    </div>

    <!-- VÀO PHÒNG -->
    <div id="scr-join" class="card hidden">
        <div class="field"><label for="in-name">Tên hiển thị</label>
            <input id="in-name" maxlength="20" autocomplete="nickname" placeholder="Tên của bạn"></div>
        <div class="field"><label for="in-code">Mã phòng</label>
            <input id="in-code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="•••••"></div>
        <button id="btn-join" class="btn btn-main">Vào phòng</button>
        <div id="join-err" class="err"></div>
    </div>

    <!-- ĐANG KẾT NỐI / VÀO LẠI -->
    <div id="scr-wait" class="card hidden">
        <div class="end"><div class="ic">⏳</div><h2 id="wait-title">Đang kết nối</h2><p id="wait-sub"></p>
            <button id="btn-wait-cancel" class="btn btn-ghost">Huỷ, nhập lại</button></div>
    </div>

    <!-- SẢNH CHỜ -->
    <div id="scr-lobby" class="card hidden">
        <div class="room-head"><div class="lbl">Phòng</div><div class="code" id="lb-code"></div></div>
        <div class="me">👤 <span id="lb-me"></span></div>
        <div id="lb-status" class="status"></div>
        <div class="list-head"><span>Người chơi</span><span id="lb-count"></span></div>
        <div id="lb-list" class="plist"></div>
        <div class="gm-line"><span id="lb-gmdot" class="dot"></span><span id="lb-gm"></span></div>
        <button id="btn-leave" class="btn btn-ghost">Rời phòng</button>
    </div>

    <!-- KẾT THÚC (bị mời ra / phòng đóng / mở ở máy khác) -->
    <div id="scr-end" class="card hidden">
        <div class="end"><div class="ic" id="end-ic"></div><h2 id="end-title"></h2><p id="end-sub"></p>
            <button id="btn-end" class="btn btn-main">Vào phòng khác</button></div>
    </div>
</div>

<script>
// ==== ĐỊA CHỈ SERVER: đổi thành link Render của bạn (wss://...) ====
const WS_SERVER = 'wss://lang-xi-nghiep-no-server.onrender.com';
// ===================================================================
const qs = new URLSearchParams(location.search);
const SERVER = qs.get('ws') || WS_SERVER;
const STORE = 'lxn_online_player_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { return null; } };
const save = v => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (e) {} };
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#0ea5e9','#6366f1','#a855f7','#ec4899','#84cc16'];
function avatar(name) {
    let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const ini = name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
    return `<span class="av" style="background:${COLORS[h % COLORS.length]}">${esc(ini)}</span>`;
}
function show(id) { ['scr-join', 'scr-wait', 'scr-lobby', 'scr-end'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
let netTimer = null;
function netMsg(t) { const n = $('net'); if (!t) { n.classList.remove('show'); return; } n.textContent = t; n.classList.add('show'); }

// ---------------- Kết nối ----------------
let ws = null, me = load(), pending = null, retry = 0, retryTimer = null, wakeTimer = null, roster = null, ended = false;
function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    if (!/^wss?:\/\//.test(SERVER) || SERVER.includes('DOI-THANH')) { showEnd('⚙️', 'Chưa cài địa chỉ server', 'Quản trò cần điền địa chỉ server trong file play.html (WS_SERVER).', false); return; }
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => netMsg('⏳ Đang đánh thức server, có thể mất khoảng 1 phút…'), 3500);
    try { ws = new WebSocket(SERVER); } catch (e) { scheduleRetry(); return; }
    ws.onopen = () => {
        clearTimeout(wakeTimer); retry = 0; netMsg('');
        if (me && me.token) sendJ({ t: 'resume', code: me.code, token: me.token });
        else if (pending) sendJ(pending);
    };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } onMsg(m); };
    ws.onclose = () => { clearTimeout(wakeTimer); if (!ended) { if (me && me.token) netMsg('📶 Mất kết nối — đang kết nối lại…'); scheduleRetry(); } };
    ws.onerror = () => {};
}
function scheduleRetry() {
    clearTimeout(retryTimer);
    if (ended) return;
    retry = Math.min(retry + 1, 6);
    retryTimer = setTimeout(connect, [500, 1000, 2000, 3000, 4000, 5000][retry - 1] || 5000);
}
function sendJ(o) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }
setInterval(() => sendJ({ t: 'ping' }), 25000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !ended) connect(); });
addEventListener('online', () => { if (!ended) connect(); });

// ---------------- Tin nhắn từ server ----------------
let resumeMiss = 0;
function onMsg(m) {
    if (m.t === 'joined') {
        me = { code: m.code, token: m.token, name: m.name, id: m.playerId }; save(me);
        try { localStorage.setItem('lxn_last_name', m.name); } catch (e) {}
        pending = null; resumeMiss = 0;
        history.replaceState(null, '', location.pathname + '?room=' + m.code + (qs.get('ws') ? '&ws=' + encodeURIComponent(qs.get('ws')) : ''));
        renderLobby(); show('scr-lobby');
    } else if (m.t === 'roster') {
        roster = m; if (me) renderLobby();
    } else if (m.t === 'error') {
        if (m.code === 'NO_ROOM_RESUME') {
            // Server vừa khởi động lại: chờ quản trò dựng lại phòng rồi thử lại
            resumeMiss++;
            show('scr-wait'); $('wait-title').textContent = 'Đang chờ quản trò';
            $('wait-sub').textContent = 'Server vừa khởi động lại. Khi quản trò mở lại app, bạn sẽ tự vào lại phòng ' + me.code + '.';
            clearTimeout(retryTimer); retryTimer = setTimeout(() => sendJ({ t: 'resume', code: me.code, token: me.token }), Math.min(3000 + resumeMiss * 1000, 8000));
            return;
        }
        if (m.code === 'NOT_MEMBER') { me = null; save(null); showJoin('Bạn không còn trong phòng này. Hãy vào lại.'); return; }
        $('btn-join').disabled = false;
        const e = $('join-err'); e.textContent = m.msg || 'Có lỗi xảy ra'; e.classList.toggle('big', m.code === 'LOCKED');
        if (m.code === 'LOCKED') e.textContent = '🔒 ' + m.msg;
        show('scr-join');
    } else if (m.t === 'kicked') {
        me = null; save(null); showEnd('🚪', 'Bạn đã được mời ra khỏi phòng', 'Quản trò đã mời bạn ra. Bạn có thể vào phòng khác.', true);
    } else if (m.t === 'room_closed') {
        me = null; save(null); showEnd('🌙', 'Quản trò đã đóng phòng', 'Cảm ơn bạn đã tham gia!', true);
    } else if (m.t === 'replaced') {
        showEnd('📱', 'Bạn đang mở phòng ở nơi khác', 'Phòng này vừa được mở ở một tab hoặc máy khác của bạn.', false, true);
    }
}

// ---------------- Giao diện ----------------
function showJoin(msg) {
    show('scr-join');
    const e = $('join-err'); e.textContent = msg || ''; e.classList.remove('big');
    $('btn-join').disabled = false;
}
function showEnd(ic, title, sub, canRejoin, reopen) {
    ended = !canRejoin && !reopen ? true : ended;
    if (reopen) { ended = true; try { ws && ws.close(); } catch (e) {} }
    $('end-ic').textContent = ic; $('end-title').textContent = title; $('end-sub').textContent = sub;
    $('btn-end').textContent = reopen ? 'Dùng ở máy này' : 'Vào phòng khác';
    $('btn-end').classList.toggle('hidden', !canRejoin && !reopen);
    $('btn-end').onclick = () => { if (reopen) { ended = false; connect(); show('scr-wait'); $('wait-title').textContent = 'Đang kết nối'; $('wait-sub').textContent = ''; } else showJoin(''); };
    show('scr-end');
}
function renderLobby() {
    if (!me) return;
    $('lb-code').textContent = me.code; $('lb-me').textContent = me.name;
    const r = roster;
    const st = $('lb-status');
    if (!r) { st.innerHTML = '<span class="dots">Đang tải danh sách</span>'; return; }
    st.classList.toggle('locked', !!r.locked);
    st.innerHTML = r.locked ? '🔒 Phòng đã khoá — chờ quản trò chia bài<span class="dots"></span>' : '<span class="dots">Đang chờ quản trò bắt đầu</span>';
    $('lb-count').textContent = r.players.length + ' người';
    $('lb-list').innerHTML = r.players.map(p => `<div class="pl${p.id === me.id ? ' mine' : ''}">${avatar(p.name)}<span class="nm">${esc(p.name)}${p.id === me.id ? ' (bạn)' : ''}</span><span class="dot${p.online ? ' on' : ''}"></span></div>`).join('');
    $('lb-gmdot').classList.toggle('on', !!r.gmOnline);
    $('lb-gm').textContent = r.gmOnline ? 'Quản trò đang trực tuyến' : 'Quản trò đang mất kết nối';
    $('btn-leave').classList.toggle('hidden', !!r.locked);
}

// ---------------- Sự kiện ----------------
$('in-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
function doJoin() {
    const name = $('in-name').value.replace(/\s+/g, ' ').trim(), code = $('in-code').value.trim();
    if (!name) { $('join-err').textContent = 'Hãy nhập tên hiển thị'; return; }
    if (code.length !== 5) { $('join-err').textContent = 'Mã phòng gồm 5 ký tự'; return; }
    $('join-err').textContent = ''; $('btn-join').disabled = true;
    pending = { t: 'join', code, name };
    if (ws && ws.readyState === 1) sendJ(pending); else connect();
}
$('btn-join').onclick = doJoin;
['in-name', 'in-code'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); }));
$('btn-leave').onclick = () => {
    if (!confirm('Rời phòng ' + me.code + '?')) return;
    sendJ({ t: 'leave' }); me = null; save(null); roster = null; showJoin('');
};
$('btn-wait-cancel').onclick = () => { me = null; save(null); showJoin(''); };

// ---------------- Khởi động ----------------
$('in-name').value = (() => { try { return localStorage.getItem('lxn_last_name') || ''; } catch (e) { return ''; } })();
const roomQ = (qs.get('room') || '').toUpperCase();
if (me && me.token && (!roomQ || roomQ === me.code)) {
    show('scr-wait'); $('wait-title').textContent = 'Đang vào lại phòng ' + me.code; $('wait-sub').textContent = '';
    connect();
} else {
    if (me && roomQ && roomQ !== me.code) { me = null; save(null); }
    $('in-code').value = roomQ.slice(0, 5);
    showJoin('');
    if (!$('in-name').value) $('in-name').focus(); else if (!$('in-code').value) $('in-code').focus();
    connect();
}
</script>
</body>
</html>
