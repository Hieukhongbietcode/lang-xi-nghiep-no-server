<style>
    :root { --bg:#0b1120; --card:#131c31; --line:#26324a; --txt:#e2e8f0; --mute:#8a96b0; --iris:#7E63F2; --iris2:#a5b4fc; --ok:#22c55e; --bad:#ef4444; --warn:#eab308; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0); display:flex; flex-direction:column; align-items:center;
        background: radial-gradient(120% 60% at 50% 0%, #1b2547 0%, var(--bg) 60%); }
    .wrap { width:100%; max-width:440px; flex:1; display:flex; flex-direction:column; padding:28px 0 24px; }
    .brand { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:22px; }
    .brand img { width:64px; height:64px; filter: drop-shadow(0 6px 18px rgba(249,115,22,.35)); }
    .brand h1 { margin:0; font-size:22px; font-weight:900; letter-spacing:-.01em; }
    .brand p { margin:0; color:var(--mute); font-size:13px; font-weight:600; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; animation: pop .28s cubic-bezier(.2,.8,.2,1.1) both; }
    @keyframes pop { from { opacity:0; transform: translateY(8px) scale(.98) } to { opacity:1; transform:none } }
    label { display:block; font-size:12px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; margin:0 0 6px; }
    input { width:100%; font:inherit; font-size:17px; font-weight:700; color:var(--txt); background:#0b1222; border:1.5px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; transition: border-color .2s; }
    input:focus { border-color: var(--iris); }
    #in-code { text-transform:uppercase; letter-spacing:.35em; text-align:center; font-size:22px; font-weight:900; }
    .field { margin-bottom:16px; }
    .btn { width:100%; font:inherit; font-size:16px; font-weight:800; border:none; border-radius:14px; padding:15px; cursor:pointer; transition: transform .1s, opacity .2s, background-color .2s; }
    .btn:active { transform: scale(.97); }
    .btn-main { background: var(--iris); color:#fff; box-shadow: 0 8px 24px rgba(126,99,242,.35); }
    .btn-main:disabled { opacity:.5; cursor:default; box-shadow:none; }
    .btn-ghost { background:transparent; color:var(--mute); border:1px solid var(--line); margin-top:12px; }
    .err { min-height:20px; margin:10px 0 0; color:#f87171; font-size:14px; font-weight:700; text-align:center; }
    .err.big { font-size:17px; }
    .room-head { text-align:center; margin-bottom:14px; }
    .room-head .lbl { color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    .room-head .code { font-size:38px; font-weight:900; letter-spacing:.25em; margin-top:2px; }
    .me { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--iris2); font-weight:800; margin-bottom:14px; }
    .status { text-align:center; padding:12px; border-radius:14px; background:#0f1730; color:var(--iris2); font-weight:700; font-size:14px; margin-bottom:14px; }
    .status.locked { color:#fde68a; background:#2a2410; }
    .status .dots::after { content:''; animation: dots 1.4s steps(4,end) infinite; }
    @keyframes dots { 0% { content:'' } 25% { content:'.' } 50% { content:'..' } 75% { content:'...' } }
    .list-head { display:flex; justify-content:space-between; color:var(--mute); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; margin:4px 2px 8px; }
    .plist { display:flex; flex-direction:column; gap:6px; }
    .pl { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:12px; background:#0f1626; animation: pop .25s ease both; }
    .pl.mine { box-shadow: inset 3px 0 0 var(--iris); background:#151d36; }
    .av { width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:900; color:#fff; flex-shrink:0; }
    .pl .nm { flex:1; font-weight:700; }
    .dot { width:9px; height:9px; border-radius:50%; background:#475569; transition: background-color .3s; }
    .dot.on { background:var(--ok); box-shadow:0 0 0 3px rgba(34,197,94,.18); }
    .gm-line { display:flex; align-items:center; gap:8px; justify-content:center; color:var(--mute); font-size:13px; font-weight:700; margin-top:14px; }
    #net { position:fixed; left:50%; top: calc(env(safe-area-inset-top, 0px) + 10px); transform: translateX(-50%) translateY(-140%); z-index:50;
        background:#1e293b; border:1px solid var(--line); color:var(--txt); font-size:13px; font-weight:700; padding:9px 14px; border-radius:999px;
        box-shadow:0 8px 24px rgba(0,0,0,.4); transition: transform .3s cubic-bezier(.2,.8,.2,1); white-space:nowrap; }
    #net.show { transform: translateX(-50%) translateY(0); }
    .end { text-align:center; padding:28px 20px; }
    .end .ic { font-size:44px; margin-bottom:8px; }
    .end h2 { margin:0 0 6px; font-size:20px; }
    .end p { margin:0 0 18px; color:var(--mute); font-weight:600; }
    /* ---- Lá bài (Giai đoạn 2) ---- */
    .cz { margin-bottom:14px; border-radius:16px; padding:16px; text-align:center; background:linear-gradient(160deg,#211a4a,#121a33); border:1px solid #3b3480; animation: pop .3s cubic-bezier(.2,.8,.2,1.1) both; }
    .cz h3 { margin:0 0 4px; font-size:17px; } .cz p { margin:0 0 12px; color:var(--mute); font-size:13px; font-weight:600; }
    .cz.done { background:#0f1f17; border-color:#1f5134; }
    .mini-card { width:64px; height:88px; margin:4px auto 12px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:900; color:#c4b5fd;
        background:linear-gradient(145deg,#312e81,#1e1b4b); border:2px solid #6d5dfc; animation: glow 2.4s ease-in-out infinite; }
    @keyframes glow { 0%,100% { box-shadow:0 0 0 0 rgba(139,124,255,.55) } 50% { box-shadow:0 0 0 10px rgba(139,124,255,0) } }
    #card-ov { position:fixed; inset:0; z-index:40; background:rgba(2,6,16,.96); display:flex; align-items:center; justify-content:center; padding:20px; animation: fade .22s ease-out; }
    @keyframes fade { from { opacity:0 } to { opacity:1 } }
    .dl-wrap { position:relative; width:min(360px, 90vw); display:flex; flex-direction:column; align-items:center; }
    .dl-scene { perspective:1200px; width:100%; position:relative; }
    .dl-flipper { position:relative; transform-style:preserve-3d; transform: rotateY(180deg); }
    .dl-flipper.open { animation: dlOpen .7s cubic-bezier(.3,.7,.2,1) forwards; }
    .dl-flipper.closing { animation: dlClose .5s cubic-bezier(.5,0,.6,1) forwards; }
    @keyframes dlOpen { 0% { transform: rotateY(180deg) scale(.92) } 70% { transform: rotateY(-8deg) scale(1.02) } 100% { transform: rotateY(0) scale(1) } }
    @keyframes dlClose { 0% { transform: rotateY(0) } 100% { transform: rotateY(180deg) scale(.9) } }
    .dl-front, .dl-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:24px; }
    .dl-front { min-height:380px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 22px; background:#1e293b; border:2px solid #334155; text-align:center; }
    .dl-back { position:absolute; inset:0; transform: rotateY(180deg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
        background: radial-gradient(120% 90% at 50% 0%, #1e2a4a, #0d1424 70%); border:2px solid #334155; }
    .dl-back-name { font-size:28px; font-weight:900; }
    .dl-back-card { width:100px; height:138px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:900; color:#c4b5fd; cursor:pointer;
        background:linear-gradient(145deg,#312e81,#1e1b4b); border:2px solid #6d5dfc; animation: glow 2.4s ease-in-out infinite; }
    .dl-back-hint { color:var(--iris2); font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; }
    .role-ic { width:96px; height:96px; object-fit:contain; filter: grayscale(1) brightness(.95); margin-bottom:14px; }
    .role-fac { display:inline-block; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; padding:3px 10px; border-radius:8px; background:#374151; color:#d1d5db; margin-bottom:10px; }
    .role-nm { font-size:30px; font-weight:900; margin-bottom:10px; }
    .role-desc { font-size:14px; line-height:1.55; color:#aab4c8; }
    .dl-x { position:absolute; top:12px; right:12px; z-index:5; width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:900;
        color:#ef4444; background:rgba(239,68,68,.16); border:1px solid rgba(239,68,68,.45); cursor:pointer; }
    .dl-confirm { margin-top:18px; opacity:0; transform:translateY(8px); pointer-events:none; transition: opacity .3s ease .45s, transform .3s ease .45s; }
    .dl-wrap.is-open .dl-confirm { opacity:1; transform:none; pointer-events:auto; }
    /* ---- Chat (Giai đoạn 3) ---- */
    .chat { margin-top:14px; border-top:1px solid var(--line); padding-top:12px; }
    .ch-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .ch-head b { font-size:13px; font-weight:800; color:var(--mute); text-transform:uppercase; letter-spacing:.06em; }
    #ch-label { font-size:12px; font-weight:800; color:#fde68a; background:#2a2410; padding:4px 10px; border-radius:999px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70%; }
    .ch-dead { font-size:12px; font-weight:700; color:#d4d4d8; background:#27272a; border-radius:10px; padding:8px 10px; margin-bottom:8px; }
    .ch-feed { height:min(46vh, 420px); min-height:200px; overflow-y:auto; background:#0b1222; border:1px solid var(--line); border-radius:14px; padding:8px 10px; display:flex; flex-direction:column; gap:3px; }
    .cm { font-size:14px; line-height:1.42; word-wrap:break-word; padding:2px 4px; border-radius:6px; animation: pop .2s ease both; }
    .cm.mine { background:rgba(126,99,242,.12); } .cm.gm { background:rgba(251,191,36,.08); }
    .cm .tag { font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; margin-right:5px; vertical-align:1px; }
    .tag.wolves { background:#450a0a; color:#fca5a5; } .tag.dead { background:#27272a; color:#d4d4d8; } .tag.couple { background:#500724; color:#f9a8d4; } .tag.dm { background:#2e1065; color:#c4b5fd; }
    .ch-empty { color:#475569; text-align:center; margin:auto; font-size:13px; font-weight:600; }
    .ch-chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .ch-chip { font:inherit; font-size:12px; font-weight:800; color:var(--mute); background:#111827; border:1px solid var(--line); border-radius:999px; padding:5px 10px; cursor:pointer; }
    .ch-chip.on { color:#fff; background:#3b2f8f; border-color:var(--iris); }
    .ch-row { display:flex; gap:8px; margin-top:8px; }
    #ch-in { flex:1; font-size:15px; padding:11px 12px; }
    #ch-in:disabled { opacity:.55; }
    #ch-send { width:48px; border:none; border-radius:14px; background:var(--iris); color:#fff; font-size:18px; cursor:pointer; }
    #ch-send:disabled { opacity:.35; }
    .ch-err { min-height:16px; font-size:12px; font-weight:700; color:#f87171; margin-top:4px; }
    #turn-toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top, 0px) + 14px); transform:translateX(-50%) translateY(-12px); opacity:0; visibility:hidden; pointer-events:none; z-index:45; max-width:92vw;

    .vbub { position:absolute; top:-30px; left:50%; transform:translateX(-50%); white-space:nowrap; font-size:11.5px; font-weight:800; padding:3px 8px; border-radius:10px; z-index:4; pointer-events:none;
        animation: bubIn .3s cubic-bezier(.2,.8,.2,1) both; box-shadow:0 4px 12px rgba(0,0,0,.45); }

    @keyframes bubIn { from { opacity:0; transform:translate(-50%, 6px) scale(.85); } }

<script>
// ==== ĐỊA CHỈ SERVER: đổi thành link Render của bạn (wss://...) ====
const WS_SERVER = 'wss://lang-xi-nghiep-no-server.onrender.com';
// ===================================================================
const qs = new URLSearchParams(location.search);
const SERVER = qs.get('ws') || WS_SERVER;
const STORE = 'lxn_online_player_v1';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
const IDS = qs.get('tab') ? sessionStorage : localStorage; // ?tab=1: mỗi tab là 1 người chơi riêng (dùng để thử)
const load = () => { try { return JSON.parse(IDS.getItem(STORE) || 'null'); } catch (e) { return null; } };
const save = v => { try { v ? IDS.setItem(STORE, JSON.stringify(v)) : IDS.removeItem(STORE); } catch (e) {} };
const COLORS = ['#ef4444','#f97316','#eab308','#22c55e','#14b8a6','#0ea5e9','#6366f1','#a855f7','#ec4899','#84cc16'];
const AVATARS = {};
function avatar(name) {
    if (AVATARS[name]) return `<img class="av av-img" src="${AVATARS[name]}" alt="">`;
    let h = 0; for (const ch of name) h = (h * 31 + ch.codePointAt(0)) >>> 0;
    const ini = name.trim().split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase() || '?';
    return `<span class="av" style="background:${COLORS[h % COLORS.length]}">${esc(ini)}</span>`;
}
function show(id) { ['scr-join', 'scr-wait', 'scr-lobby', 'scr-end'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
let netTimer = null;
function netMsg(t) { const n = $('net'); if (!t) { n.classList.remove('show'); return; } n.textContent = t; n.classList.add('show'); }

// ---------------- Kết nối ----------------
let ws = null, me = load(), pending = null, retry = 0, retryTimer = null, wakeTimer = null, roster = null, ended = false;
function connect() {
    if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
    if (!/^wss?:\/\//.test(SERVER) || SERVER.includes('DOI-THANH')) { showEnd('⚙️', 'Chưa cài địa chỉ server', 'Quản trò cần điền địa chỉ server trong file play.html (WS_SERVER).', false); return; }
    clearTimeout(wakeTimer);
    wakeTimer = setTimeout(() => netMsg('⏳ Đang đánh thức server, có thể mất khoảng 1 phút…'), 3500);

$('rules-ov').addEventListener('keydown', e => { if (e.key === 'Escape') closeRules(); });
$('rt-roles').onclick = () => { rulesTab = 'roles'; renderRules(); }; $('rt-rules').onclick = () => { rulesTab = 'rules'; renderRules(); };
$('rules-q').oninput = renderRules;
// ---------------- Giao diện ----------------
function showJoin(msg) {
    show('scr-join');
    const e = $('join-err'); e.textContent = msg || ''; e.classList.remove('big');
    $('btn-join').disabled = false;
}
function showEnd(ic, title, sub, canRejoin, reopen) {
    ended = !canRejoin && !reopen ? true : ended;
    if (reopen) { ended = true; try { ws && ws.close(); } catch (e) {} }
    $('end-ic').textContent = ic; $('end-title').textContent = title; $('end-sub').textContent = sub;
    $('btn-end').textContent = reopen ? 'Dùng ở máy này' : 'Vào phòng khác';
    $('btn-end').classList.toggle('hidden', !canRejoin && !reopen);
    $('btn-end').onclick = () => { if (reopen) { ended = false; connect(); show('scr-wait'); $('wait-title').textContent = 'Đang kết nối'; $('wait-sub').textContent = ''; } else showJoin(''); };
    show('scr-end');
}
function renderLobby() {
    if (!me) return;
    $('lb-code').textContent = me.code; $('lb-me').textContent = me.name;
    const r = roster;
    const st = $('lb-status');
    if (!r) { st.innerHTML = '<span class="dots">Đang tải danh sách</span>'; return; }
    st.classList.toggle('locked', !!r.locked);
    st.innerHTML = phase === 'started' ? '🌙 Ván đã bắt đầu'
        : card ? '🃏 Quản trò đã chia bài'
        : r.locked ? (phase === 'waiting' && card === null && r.locked ? '🔒 Phòng đã khoá — chờ quản trò chia bài<span class="dots"></span>' : '🔒 Phòng đã khoá')
        : '<span class="dots">Đang chờ quản trò bắt đầu</span>';
    renderCardZone();
    if (phase === 'started' && !window._rosterFolded) { window._rosterFolded = true; $('lb-roster').open = false; }
    document.body.classList.toggle('ingame', (phase === 'started' && !!card) || (!!me.spec && phase === 'started'));
    document.body.classList.toggle('lobbyring', !!me && !me.spec && phase !== 'started');   // vòng làng giữ chỗ ngay từ sảnh (không chen vào sau)
    if (!window._rosterInit) { window._rosterInit = true; $('lb-roster').open = false; }        // danh sách thu gọn: vòng làng đã cho thấy ai vào
    renderRoleBar(); renderRing(); renderPickBar(); renderHangBar();
    $('g-status').classList.toggle('myturn', !!(fieldsMsg && fieldsMsg.fields && fieldsMsg.fields.length) || !!(can.turn || can.wolves || can.couple));
    $('g-status').textContent = gstatus ? gstatus.text : ''; $('g-status').classList.toggle('hidden', !gstatus || !!endInfo);
    renderEnd();
    $('ch-ghost').classList.toggle('hidden', !ghostL.length); $('ch-ghost').innerHTML = ghostL.length ? `👻 Con Ma đã viết: <b>${ghostL.map(esc).join(' ')}</b>` : '';
    renderChat();
    $('lb-count').textContent = r.players.length + ' người';
    $('lb-list').innerHTML = r.players.map(p => `<div class="pl${p.id === me.id ? ' mine' : ''}">${avatar(p.name)}<span class="nm">${esc(p.name)}${p.id === me.id ? ' (bạn)' : ''}</span><span class="dot${p.online ? ' on' : ''}"></span></div>`).join('');
    $('lb-gmdot').classList.toggle('on', !!r.gmOnline);
    $('lb-gm').textContent = r.gmOnline ? 'Quản trò đang trực tuyến' : 'Quản trò đang mất kết nối';
    $('btn-leave').classList.toggle('hidden', !!r.locked);
}

// ---------------- Sự kiện ----------------
$('in-code').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); });
function doJoin(mode) {
    const name = $('in-name').value.replace(/\s+/g, ' ').trim(), code = $('in-code').value.trim();
    if (!name) { $('join-err').textContent = 'Hãy nhập tên hiển thị'; return; }
    if (code.length !== 5) { $('join-err').textContent = 'Mã phòng gồm 5 ký tự'; return; }
    $('join-err').textContent = ''; $('btn-join').disabled = true;
    pending = { t: 'join', code, name, avatar: myAvatar || undefined }; if (mode === 'knock') pending.knock = true; if (mode === 'spectate') pending.spectate = true;
    saveProfile(name);
    $('btn-spec').disabled = true; $('btn-knock').disabled = true;
    if (ws && ws.readyState === 1) sendJ(pending); else connect();
}
$('btn-join').onclick = doJoin;
$('btn-knock').onclick = () => doJoin('knock');
$('btn-spec').onclick = () => doJoin('spectate');
['in-name', 'in-code'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doJoin(); }));
$('btn-leave').onclick = () => {
    if (!confirm('Rời phòng ' + me.code + '?')) return;
    sendJ({ t: 'leave' }); me = null; save(null); roster = null; card = null; phase = 'waiting'; chatList = []; chatSeen = new Set(); can = {}; pack = null; village = null; document.body.classList.remove('ingame'); showJoin('');
};
$('btn-wait-cancel').onclick = () => { me = null; save(null); showJoin(''); };

// ---------------- Ảnh đại diện + hồ sơ lưu trên máy ----------------
const PROFILE = 'lxn_profile_v1';
let myAvatar = (() => { try { return (JSON.parse(IDS.getItem(PROFILE) || localStorage.getItem(PROFILE) || '{}').avatar) || ''; } catch (e) { return ''; } })();
function saveProfile(name) { try { const v = JSON.stringify({ name: name || $('in-name').value.trim(), avatar: myAvatar }); IDS.setItem(PROFILE, v); if (IDS !== localStorage) {} else localStorage.setItem(PROFILE, v); } catch (e) {} }
function paintAvPrev() { $('av-prev').innerHTML = myAvatar ? `<img src="${myAvatar}" alt="">` : '📷'; }
// cắt vuông giữa ảnh, thu nhỏ 128px -> vài KB
function shrinkImage(file) {
    return new Promise((res, rej) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
            const S = 128, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d');
            const m = Math.min(img.width, img.height); x.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
            URL.revokeObjectURL(url);
            let q = .82, out = c.toDataURL('image/jpeg', q); while (out.length > 22000 && q > .3) { q -= .12; out = c.toDataURL('image/jpeg', q); }
            res(out);
        };
        img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Ảnh không đọc được')); };
        img.src = url;
    });
}
$('in-av').onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { myAvatar = await shrinkImage(f); paintAvPrev(); saveProfile(); if (me && ws && ws.readyState === 1) sendJ({ t: 'set_avatar', data: myAvatar }); }
    catch (x) { $('join-err').textContent = 'Không đọc được ảnh, thử ảnh khác'; }
    e.target.value = '';
};
paintAvPrev();

// ---------------- Khởi động ----------------
try { document.documentElement.style.setProperty('--lxn-logo', `url("${document.querySelector('.brand img').src}")`); } catch (e) {}
$('in-name').value = (() => { try { const p = JSON.parse(IDS.getItem(PROFILE) || localStorage.getItem(PROFILE) || '{}'); return p.name || localStorage.getItem('lxn_last_name') || ''; } catch (e) { return ''; } })();
const roomQ = (qs.get('room') || '').toUpperCase();
if (me && me.token && (!roomQ || roomQ === me.code)) {
    show('scr-wait'); $('wait-title').textContent = 'Đang vào lại phòng ' + me.code; $('wait-sub').textContent = '';
    connect();
} else {
    if (me && roomQ && roomQ !== me.code) { me = null; save(null); }
    $('in-code').value = roomQ.slice(0, 5);
    showJoin('');
    if (!$('in-name').value) $('in-name').focus(); else if (!$('in-code').value) $('in-code').focus();
    connect();
}
</script>
</body>
</html>
